# pnpm 11+ reads only auth/registry keys from .npmrc; every other setting
# lives here in camelCase.
packages:
  - 'demo'

# Every version below was checked against the npm registry on 2026-10-24.
catalog:
  nuxt: ^4.6.2
  vue: ^3.5.44
  '@nuxtjs/color-mode': ^4.0.1
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  wrangler: ^4.152.0

# Nuxt 4.5+ runs on unhead v3. Keep one copy on the release that fixed the
# Cloudflare preset build break (nuxt/nuxt#35670).
overrides:
  unhead: '>=3.4.3'

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: false
  unrs-resolver: true
  vue-demi: false
  workerd: true

minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@1.4.0'
  - vite-plus@1.4.0
